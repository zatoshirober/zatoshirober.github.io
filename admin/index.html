
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zatoshi Rober | Admin</title>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #2A2A2A;

            color: #FFFFFF;

            padding: 40px;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-container {

            max-width: 420px;

            margin: 100px auto;

            padding: 35px;

            background: #222222;

            border:
                1px solid
                rgba(255,255,255,0.12);
        }


        .login-container h1 {
            margin-bottom: 10px;
        }


        .login-subtitle {
            opacity: 0.6;
            margin-bottom: 30px;
        }


        .login-field {
            margin-bottom: 20px;
        }


        .login-field label {
            display: block;

            margin-bottom: 8px;

            color: #49DD4B;

            font-size: 0.9rem;
        }


        .login-field input {
            width: 100%;

            padding: 12px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background: #1A1A1A;

            color: #FFFFFF;

            font-family: inherit;
        }


        .login-button {
            width: 100%;

            padding: 12px;

            border:
                1px solid
                #49DD4B;

            background: #49DD4B;

            color: #2A2A2A;

            cursor: pointer;

            font-weight: bold;
        }


        .login-button:hover {
            opacity: 0.85;
        }


        .login-error {
            margin-top: 15px;

            color: #ff6b6b;

            display: none;
        }


        /* =========================
           ADMIN PANEL
        ========================= */

        #admin-panel {
            display: none;
        }


        h1 {
            margin-bottom: 10px;
        }


        .subtitle {
            opacity: 0.6;

            margin-bottom: 20px;
        }


        .logout-button {
            padding: 10px 18px;

            margin-bottom: 25px;

            border:
                1px solid
                rgba(255,255,255,0.3);

            background: transparent;

            color: #FFFFFF;

            cursor: pointer;
        }


        .logout-button:hover {
            border-color: #49DD4B;

            color: #49DD4B;
        }


        /* =========================
           ADMIN ACTIONS
        ========================= */

        .admin-actions {
            display: flex;

            gap: 15px;

            margin-bottom: 40px;

            flex-wrap: wrap;
        }


        .add-project-button {
            padding: 12px 20px;

            border:
                1px solid
                #49DD4B;

            background: #49DD4B;

            color: #2A2A2A;

            cursor: pointer;

            font-weight: bold;

            transition: 0.3s;
        }


        .add-project-button:hover {
            opacity: 0.85;
        }


        /* =========================
           PROJECTS
        ========================= */

        .projects {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 25px;
        }


        .project-card {
            border:
                1px solid
                rgba(255,255,255,0.12);

            padding: 25px;

            background: #222222;
        }


        .project-number {
            color: #49DD4B;

            font-size: 0.85rem;

            margin-bottom: 10px;
        }


        .project-card h2 {
            margin-bottom: 15px;
        }


        .project-card p {
            opacity: 0.6;

            margin-bottom: 20px;
        }


        /* =========================
           TAGS
        ========================= */

        .tags {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 25px;
        }


        .tag {
            border:
                1px solid
                rgba(73,221,75,0.4);

            color: #49DD4B;

            padding: 5px 9px;

            font-size: 0.75rem;
        }


        /* =========================
           BUTTON
        ========================= */

        .edit-button {
            display: inline-block;

            padding: 10px 18px;

            border:
                1px solid
                #49DD4B;

            background: transparent;

            color: #49DD4B;

            cursor: pointer;

            font-weight: bold;

            transition: 0.3s;
        }


        .edit-button:hover {
            background: #49DD4B;

            color: #2A2A2A;
        }


        /* =========================
           EDITOR
        ========================= */

        .editor {
            display: none;

            margin-top: 40px;

            padding: 30px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background: #222222;
        }


        .editor.active {
            display: block;
        }


        .editor h2 {
            margin-bottom: 30px;
        }


        .field {
            margin-bottom: 20px;
        }


        .field label {
            display: block;

            margin-bottom: 8px;

            color: #49DD4B;

            font-size: 0.9rem;
        }


        .field input,
        .field textarea {
            width: 100%;

            padding: 12px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background: #1A1A1A;

            color: #FFFFFF;

            font-family: inherit;
        }


        .field textarea {
            min-height: 120px;

            resize: vertical;
        }


        .editor-actions {
            display: flex;

            gap: 15px;

            margin-top: 30px;

            flex-wrap: wrap;
        }


        .save-button,
        .cancel-button {
            padding: 12px 20px;

            cursor: pointer;

            font-weight: bold;
        }


        .save-button {
            border:
                1px solid
                #49DD4B;

            background: #49DD4B;

            color: #2A2A2A;
        }


        .cancel-button {
            border:
                1px solid
                rgba(255,255,255,0.3);

            background: transparent;

            color: #FFFFFF;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 25px 15px;
            }


            .login-container {
                margin: 50px auto;

                padding: 25px;
            }


            .editor {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================

    <div

        <h1>

        </h1>

        <div class="login-field">

            <label for="login-email">

            <input

        </div>


        <div class="login-field">

            <label for="login-password">
                Password
            </label>

            <input
                type="password"
                id="login-password"

            >

        </div>


        <button
            class="login-button"
            id="login-button"
        >
            LOGIN
        </button>


        <p
            class="login-error"

        ></p>

    </div>



    <!-- =========================
         ADMIN PANEL
    ========================= -->

    <div id="admin-panel">

        <h1>
            Zatoshi Rober
        </h1>


        <p class="subtitle">
            Admin Panel — Projects
        </p>


        <button

        <!-- =========================
             ADMIN ACTIONS
        ========================= -->

        <div class="admin-actions">

            <button

                + ADD PROJECT
            </button>

        </div>



        <!-- =========================
             PROJECTS
        ========================= -->

        <div
            class="projects"
            id="projects-container"
        ></div>



        <!-- =========================
             EDITOR
        ========================= -->

        <div
            class="editor"
            id="editor"
        >

            <h2 id="editor-title">
                Edit Project
            </h2>


            <div class="field">

                <label for="number">
                    Project Number
                </label>

                <input
                    type="text"
                    id="number"
                    placeholder="04"
                >

            </div>


            <div class="field">

                <label for="title">
                    Project Title
                </label>

                <input
                    type="text"
                    id="title"
                >

            </div>


            <div class="field">

                <label for="image">
                    Image
                </label>

                <input
                    type="text"
                    id="image"
                    placeholder="portada1.png"
                >

            </div>


            <div class="field">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                ></textarea>

            </div>


            <div class="field">

                <label for="tags">
                    Tags
                </label>

                <input
                    type="text"
                    id="tags"
                    placeholder="Unity, C#, 2D"
                >

            </div>


            <div class="field">

                <label for="link">
                    Project Link
                </label>

                <input
                    type="text"
                    id="link"
                    placeholder="https://..."
                >

            </div>


            <div class="field">

                <label for="buttonText">
                    Button Text
                </label>

                <input
                    type="text"
                    id="buttonText"
                    placeholder="VIEW GAME"
                >

            </div>


            <div class="field">

                <label for="featured">
                    Featured
                </label>

                <input
                    type="checkbox"
                    id="featured"
                    style="
                        width: auto;
                        transform: scale(1.3);
                    "
                >

            </div>


            <div class="editor-actions">

                <button
                    class="save-button"
                    id="save-button"
                >
                    SAVE
                </button>


                <button
                    class="cancel-button"
                    id="cancel-button"
                >
                    CANCEL
                </button>

            </div>

        </div>

    </div>
