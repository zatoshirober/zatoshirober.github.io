
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zatoshi Rober - Admin Panel</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        /* =========================
           LOGIN
        ========================= */

        .login-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .login-box h1 {
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .login-box p {
            color: rgba(255,255,255,0.55);
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.75);
        }

        .field input,
        .field textarea {
            width: 100%;
            padding: 13px 14px;
            background: #181818;
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            outline: none;
            border-radius: 0;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: #49DD4B;
        }

        .field textarea {
            min-height: 130px;
            resize: vertical;
        }

        .login-button,
        .save-button,
        .add-button {
            border: none;
            background: #49DD4B;
            color: #111;
            padding: 13px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button {
            width: 100%;
        }

        .login-button:hover,
        .save-button:hover,
        .add-button:hover {
            opacity: 0.85;
        }

        .login-button:disabled,
        .save-button:disabled,
        .add-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .message.error {
            color: #ff6868;
        }

        .message.success {
            color: #49DD4B;
        }

        /* =========================
           ADMIN
        ========================= */

        .admin-panel {
            display: none;
            min-height: 100vh;
        }

        .admin-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .admin-header h1 {
            font-size: 1.5rem;
        }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-button {
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            padding: 10px 16px;
            cursor: pointer;
        }

        .logout-button:hover {
            border-color: #49DD4B;
            color: #49DD4B;
        }

        .admin-content {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 0 80px;
        }

        .projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .projects-header h2 {
            font-size: 1.8rem;
        }

        .projects-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .project-card {
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
        }

        .project-number {
            color: #49DD4B;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .project-card h3 {
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .project-card p {
            color: rgba(255,255,255,0.6);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .project-meta {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.45);
            margin-bottom: 20px;
        }

        .edit-button {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            cursor: pointer;
        }

        .edit-button:hover {
            border-color: #49DD4B;
            color: #49DD4B;
        }

        /* =========================
           EDITOR
        ========================= */

        .editor {
            display: none;
            margin-top: 40px;
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 35px;
        }

        .editor h2 {
            margin-bottom: 30px;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .editor-grid .full {
            grid-column: 1 / -1;
        }

        .checkbox-field {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-field input {
            width: 18px;
            height: 18px;
            accent-color: #49DD4B;
        }

        .editor-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .cancel-button {
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            padding: 13px 20px;
            cursor: pointer;
        }

        .cancel-button:hover {
            border-color: white;
        }

        .loading {
            color: rgba(255,255,255,0.5);
            padding: 30px 0;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .login-box {
                padding: 30px 25px;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-header-right {
                width: 100%;
                justify-content: space-between;
            }

            .projects-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .editor-grid {
                grid-template-columns: 1fr;
            }

            .editor-grid .full {
                grid-column: auto;
            }

            .editor {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN
    ========================= -->

    <section class="login-screen" id="login-screen">

        <div class="login-box">

            <h1>Zatoshi Rober</h1>

            <p>Admin Panel</p>

            <form id="login-form">

                <div class="field">
                    <label for="login-email">Email</label>

                    <input
                        type="email"
                        id="login-email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="login-password">Password</label>

                    <input
                        type="password"
                        id="login-password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="login-button"
                >
                    LOGIN
                </button>

                <div
                    id="login-message"
                    class="message"
                ></div>

            </form>

        </div>

    </section>


    <!-- =========================
         ADMIN PANEL
    ========================= -->

    <section
        class="admin-panel"
        id="admin-panel"
    >

        <header class="admin-header">

            <h1>Admin Panel</h1>

            <div class="admin-header-right">

                <span id="admin-email"></span>

                <button
                    type="button"
                    class="logout-button"
                    id="logout-button"
                >
                    LOGOUT
                </button>

            </div>

        </header>


        <main class="admin-content">

            <div class="projects-header">

                <h2>Projects</h2>

                <button
                    type="button"
                    class="add-button"
                    id="add-project-button"
                >
                    + ADD PROJECT
                </button>

            </div>


            <div
                id="projects-list"
                class="projects-list"
            >
                <div class="loading">
                    Loading projects...
                </div>
            </div>


            <!-- =========================
                 EDITOR
            ========================= -->

            <div
                class="editor"
                id="editor"
            >

                <h2 id="editor-title">
                    Edit Project
                </h2>

                <form id="project-form">

                    <div class="editor-grid">

                        <!-- NUMBER -->

                        <div class="field">

                            <label for="project-number">
                                Number
                            </label>

                            <input
                                type="text"
                                id="project-number"
                                placeholder="01"
                            >

                        </div>


                        <div class="field">

    <label for="projectNumber">
        Project Number
    </label>

    <input
        type="number"
        id="projectNumber"
        min="1"
    >

</div>


<div class="field">

    <label for="featured">
        Featured Project
    </label>

    <select id="featured">

        <option value="false">
            No
        </option>

        <option value="true">
            Yes
        </option>

    </select>

</div>


                        <!-- TITLE -->

                        <div class="field">

                            <label for="project-title">
                                Title
                            </label>

                            <input
                                type="text"
                                id="project-title"
                                required
                            >

                        </div>


                        <!-- IMAGE -->

                        <div class="field full">

                            <label for="project-image">
                                Image
                            </label>

                            <input
                                type="text"
                                id="project-image"
                                placeholder="portada1.png"
                            >

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="field full">

                            <label for="project-description">
                                Description
                            </label>

                            <textarea
                                id="project-description"
                            ></textarea>

                        </div>


                        <!-- TAGS -->

                        <div class="field full">

                            <label for="project-tags">
                                Tags
                            </label>

                            <input
                                type="text"
                                id="project-tags"
                                placeholder="Unity, C#, 2D, Puzzle Platformer"
                            >

                        </div>


                        <!-- LINK -->

                        <div class="field">

                            <label for="project-link">
                                Link
                            </label>

                            <input
                                type="text"
                                id="project-link"
                                placeholder="https://..."
                            >

                        </div>


                        <!-- BUTTON -->

                        <div class="field">

                            <label for="project-button-text">
                                Button Text
                            </label>

                            <input
                                type="text"
                                id="project-button-text"
                                placeholder="VIEW GAME"
                            >

                        </div>


                        <!-- FEATURED -->

                        <div class="field full">

                            <label class="checkbox-field">

                                <input
                                    type="checkbox"
                                    id="project-featured"
                                >

                                <span>
                                    Featured project
                                </span>

                            </label>

                        </div>

                    </div>


                    <div class="editor-actions">

                        <button
                            type="submit"
                            class="save-button"
                            id="save-button"
                        >
                            SAVE
                        </button>

                        <button
                            type="button"
                            class="cancel-button"
                            id="cancel-button"
                        >
                            CANCEL
                        </button>

                    </div>


                    <div
                        id="editor-message"
                        class="message"
                    ></div>

                </form>

            </div>

        </main>

    </section>


    <script>

        /* =====================================================
           SUPABASE CONFIGURATION
        ===================================================== */

        const SUPABASE_URL =
            "https://dtyxomanxjghnqoshojk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_JGKuOtOYZxH7dG7NDtiOAg_mT2MgGbE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginScreen =
            document.getElementById("login-screen");

        const adminPanel =
            document.getElementById("admin-panel");

        const loginForm =
            document.getElementById("login-form");

        const loginEmail =
            document.getElementById("login-email");

        const loginPassword =
            document.getElementById("login-password");

        const loginButton =
            document.getElementById("login-button");

        const loginMessage =
            document.getElementById("login-message");

        const adminEmail =
            document.getElementById("admin-email");

        const logoutButton =
            document.getElementById("logout-button");

        const projectsList =
            document.getElementById("projects-list");

        const addProjectButton =
            document.getElementById("add-project-button");

        const editor =
            document.getElementById("editor");

        const editorTitle =
            document.getElementById("editor-title");

        const projectForm =
            document.getElementById("project-form");

        const projectNumber =
            document.getElementById("project-number");

        const projectTitle =
            document.getElementById("project-title");

        const projectImage =
            document.getElementById("project-image");

        const projectDescription =
            document.getElementById("project-description");

        const projectTags =
            document.getElementById("project-tags");

        const projectLink =
            document.getElementById("project-link");

        const projectButtonText =
            document.getElementById("project-button-text");

        const projectFeatured =
            document.getElementById("project-featured");

        const cancelButton =
            document.getElementById("cancel-button");

        const saveButton =
            document.getElementById("save-button");

        const editorMessage =
            document.getElementById("editor-message");


        /* =====================================================
           STATE
        ===================================================== */

        let selectedProject = null;

        let creatingProject = false;


        /* =====================================================
           MESSAGE HELPERS
        ===================================================== */

        function showLoginMessage(message, type = "error") {

            loginMessage.textContent = message;

            loginMessage.className =
                "message " + type;
        }


        function showEditorMessage(message, type = "error") {

            editorMessage.textContent = message;

            editorMessage.className =
                "message " + type;
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        async function login() {

            const email =
                loginEmail.value.trim();

            const password =
                loginPassword.value;


            if (!email || !password) {

                showLoginMessage(
                    "Please enter your email and password."
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent = "LOGGING IN...";

            showLoginMessage("");


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error(
                        "Supabase login error:",
                        error
                    );

                    showLoginMessage(
                        error.message
                    );

                    return;
                }


                if (!data || !data.user) {

                    showLoginMessage(
                        "Login failed. No user session was created."
                    );

                    return;
                }


                showAdminPanel(
                    data.user
                );


            } catch (error) {

                console.error(
                    "Login exception:",
                    error
                );

                showLoginMessage(
                    "An unexpected error occurred while logging in."
                );

            } finally {

                loginButton.disabled = false;

                loginButton.textContent = "LOGIN";
            }
        }


        /* =====================================================
           LOGIN FORM
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                login();

            }
        );


        /* =====================================================
           SHOW ADMIN
        ===================================================== */

        async function showAdminPanel(user) {

            loginScreen.style.display = "none";

            adminPanel.style.display = "block";

            adminEmail.textContent =
                user.email || "";


            await loadProjects();
        }


        /* =====================================================
           CHECK EXISTING SESSION
        ===================================================== */

        async function checkSession() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.getSession();


                if (error) {

                    console.error(
                        "Session error:",
                        error
                    );

                    return;
                }


                if (
                    data &&
                    data.session &&
                    data.session.user
                ) {

                    showAdminPanel(
                        data.session.user
                    );

                }

            } catch (error) {

                console.error(
                    "Session exception:",
                    error
                );
            }
        }


        /* =====================================================
           LOAD PROJECTS
        ===================================================== */

        async function loadProjects() {

            projectsList.innerHTML =
                '<div class="loading">Loading projects...</div>';


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("projects")
                    .select("*")
                    .order("id", {
                        ascending: true
                    });


            if (error) {

                console.error(
                    "Load projects error:",
                    error
                );

                projectsList.innerHTML =
                    '<div class="message error">' +
                    "Error loading projects: " +
                    error.message +
                    "</div>";

                return;
            }


            if (!data || data.length === 0) {

                projectsList.innerHTML =
                    '<div class="loading">' +
                    "No projects found." +
                    "</div>";

                return;
            }


            renderProjects(data);
        }


        /* =====================================================
           RENDER PROJECTS
        ===================================================== */

        function renderProjects(projects) {

            projectsList.innerHTML = "";


            projects.forEach(function(project) {

                const card =
                    document.createElement("div");

                card.className =
                    "project-card";


                const number =
                    project.number || "";


                const title =
                    project.title || "Untitled";


                const description =
                    project.description || "";


                const featured =
                    project.featured
                        ? "Featured"
                        : "Standard";


                card.innerHTML = `

                    <div class="project-number">
                        ${escapeHTML(number)}
                    </div>

                    <h3>
                        ${escapeHTML(title)}
                    </h3>

                    <p>
                        ${escapeHTML(description)}
                    </p>

                    <div class="project-meta">
                        ${escapeHTML(featured)}
                    </div>

                    <button
                        type="button"
                        class="edit-button"
                    >
                        EDIT PROJECT
                    </button>

                `;


                const editButton =
                    card.querySelector(".edit-button");


                editButton.addEventListener(
                    "click",
                    function() {

                        openEditor(project);

                    }
                );


                projectsList.appendChild(card);

            });
        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(value) {

            if (value === null ||
                value === undefined) {

                return "";
            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           OPEN EDITOR
        ===================================================== */

        function openEditor(project) {

            selectedProject = project;

            creatingProject = false;


            editorTitle.textContent =
                "Edit Project";


            projectNumber.value =
                project.number || "";


            projectTitle.value =
                project.title || "";


            projectImage.value =
                project.image || "";


            projectDescription.value =
                project.description || "";


            projectTags.value =
                project.tags || "";


            projectLink.value =
                project.link || "";


            projectButtonText.value =
                project.button_text || "";


            projectFeatured.checked =
                project.featured === true;


            showEditorMessage("");


            editor.style.display =
                "block";


            editor.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }


        /* =====================================================
           ADD PROJECT
        ===================================================== */

        addProjectButton.addEventListener(
            "click",
            function() {

                creatingProject = true;

                selectedProject = null;


                editorTitle.textContent =
                    "Add Project";


                projectForm.reset();


                projectFeatured.checked =
                    false;


                showEditorMessage("");


                editor.style.display =
                    "block";


                editor.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }
        );


        /* =====================================================
           SAVE PROJECT
        ===================================================== */

        projectForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                saveButton.disabled = true;

                saveButton.textContent =
                    "SAVING...";

                showEditorMessage("");


                const projectData = {

                    number:
                        projectNumber.value.trim(),

                    title:
                        projectTitle.value.trim(),

                    image:
                        projectImage.value.trim(),

                    description:
                        projectDescription.value.trim(),

                    tags:
                        projectTags.value.trim(),

                    link:
                        projectLink.value.trim(),

                    button_text:
                        projectButtonText.value.trim(),

                    featured:
                        projectFeatured.checked

                };


                if (!projectData.title) {

                    showEditorMessage(
                        "The project title is required."
                    );

                    saveButton.disabled = false;

                    saveButton.textContent =
                        "SAVE";

                    return;
                }


                try {

                    if (creatingProject) {

                        /* =========================
                           CREATE
                        ========================= */

                        const {
                            data,
                            error
                        } =
                            await supabaseClient
                                .from("projects")
                                .insert(projectData)
                                .select()
                                .single();


                        if (error) {

                            console.error(
                                "Create project error:",
                                error
                            );

                            showEditorMessage(
                                "Error creating project: " +
                                error.message
                            );

                            return;
                        }


                        selectedProject =
                            data;


                        showEditorMessage(
                            "Project created successfully.",
                            "success"
                        );


                        creatingProject = false;


                        editorTitle.textContent =
                            "Edit Project";


                        await loadProjects();

                    } else {

                        /* =========================
                           UPDATE
                        ========================= */

                        if (!selectedProject) {

                            showEditorMessage(
                                "No project selected."
                            );

                            return;
                        }


                        const {
                            data,
                            error
                        } =
                            await supabaseClient
                                .from("projects")
                                .update(projectData)
                                .eq(
                                    "id",
                                    selectedProject.id
                                )
                                .select()
                                .single();


                        if (error) {

                            console.error(
                                "Update project error:",
                                error
                            );

                            showEditorMessage(
                                "Error saving project: " +
                                error.message
                            );

                            return;
                        }


                        selectedProject =
                            data;


                        showEditorMessage(
                            "Project saved successfully.",
                            "success"
                        );


                        await loadProjects();
                    }


                } catch (error) {

                    console.error(
                        "Save exception:",
                        error
                    );

                    showEditorMessage(
                        "Unexpected error while saving."
                    );

                } finally {

                    saveButton.disabled = false;

                    saveButton.textContent =
                        "SAVE";
                }

            }
        );


        /* =====================================================
           CANCEL
        ===================================================== */

        cancelButton.addEventListener(
            "click",
            function() {

                editor.style.display =
                    "none";

                selectedProject = null;

                creatingProject = false;

                projectForm.reset();

                showEditorMessage("");
            }
        );


        /* =====================================================
           LOGOUT
        ===================================================== */

        logoutButton.addEventListener(
            "click",
            async function() {

                await supabaseClient.auth.signOut();

                adminPanel.style.display =
                    "none";

                loginScreen.style.display =
                    "flex";

                loginForm.reset();

                showLoginMessage("");

                editor.style.display =
                    "none";

                selectedProject = null;

                creatingProject = false;
            }
        );


        /* =====================================================
           AUTH STATE
        ===================================================== */

        supabaseClient.auth.onAuthStateChange(
            function(event, session) {

                if (
                    event === "SIGNED_OUT" ||
                    !session
                ) {

                    adminPanel.style.display =
                        "none";

                    loginScreen.style.display =
                        "flex";

                }

            }
        );
