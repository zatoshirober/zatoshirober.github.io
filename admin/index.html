
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zatoshi Rober | Admin</title>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #2A2A2A;

            color: #FFFFFF;

            padding: 40px;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-container {

            max-width: 420px;

            margin: 100px auto;

            padding: 35px;

            background: #222222;

            border:
                1px solid
                rgba(255,255,255,0.12);
        }


        .login-container h1 {

            margin-bottom: 10px;
        }


        .login-subtitle {

            opacity: 0.6;

            margin-bottom: 30px;
        }


        .login-field {

            margin-bottom: 20px;
        }


        .login-field label {

            display: block;

            margin-bottom: 8px;

            color: #49DD4B;

            font-size: 0.9rem;
        }


        .login-field input {

            width: 100%;

            padding: 12px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background: #1A1A1A;

            color: #FFFFFF;

            font-family: inherit;
        }


        .login-button {

            width: 100%;

            padding: 12px;

            border:
                1px solid
                #49DD4B;

            background: #49DD4B;

            color: #2A2A2A;

            cursor: pointer;

            font-weight: bold;
        }


        .login-button:hover {

            opacity: 0.85;
        }


        .login-error {

            margin-top: 15px;

            color: #ff6b6b;

            display: none;
        }


        /* =========================
           ADMIN PANEL
        ========================= */

        #admin-panel {

            display: none;
        }


        h1 {
            margin-bottom: 10px;
        }


        .subtitle {

            opacity: 0.6;

            margin-bottom: 20px;
        }


        .logout-button {

            padding: 10px 18px;

            margin-bottom: 40px;

            border:
                1px solid
                rgba(255,255,255,0.3);

            background: transparent;

            color: #FFFFFF;

            cursor: pointer;
        }


        .logout-button:hover {

            border-color: #49DD4B;

            color: #49DD4B;
        }


        /* =========================
           PROJECTS
        ========================= */

        .projects {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 25px;
        }


        .project-card {

            border:
                1px solid
                rgba(255,255,255,0.12);

            padding: 25px;

            background: #222222;
        }


        .project-number {

            color: #49DD4B;

            font-size: 0.85rem;

            margin-bottom: 10px;
        }


        .project-card h2 {

            margin-bottom: 15px;
        }


        .project-card p {

            opacity: 0.6;

            margin-bottom: 20px;
        }


        /* =========================
           TAGS
        ========================= */

        .tags {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 25px;
        }


        .tag {

            border:
                1px solid
                rgba(73,221,75,0.4);

            color: #49DD4B;

            padding: 5px 9px;

            font-size: 0.75rem;
        }


        /* =========================
           BUTTON
        ========================= */

        .edit-button {

            display: inline-block;

            padding: 10px 18px;

            border:
                1px solid
                #49DD4B;

            background: transparent;

            color: #49DD4B;

            cursor: pointer;

            font-weight: bold;

            transition: 0.3s;
        }


        .edit-button:hover {

            background: #49DD4B;

            color: #2A2A2A;
        }


        /* =========================
           EDITOR
        ========================= */

        .editor {

            display: none;

            margin-top: 40px;

            padding: 30px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background: #222222;
        }


        .editor.active {

            display: block;
        }


        .editor h2 {

            margin-bottom: 30px;
        }


        .field {

            margin-bottom: 20px;
        }


        .field label {

            display: block;

            margin-bottom: 8px;

            color: #49DD4B;

            font-size: 0.9rem;
        }


        .field input,
        .field textarea {

            width: 100%;

            padding: 12px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background: #1A1A1A;

            color: #FFFFFF;

            font-family: inherit;
        }


        .field textarea {

            min-height: 120px;

            resize: vertical;
        }


        .editor-actions {

            display: flex;

            gap: 15px;

            margin-top: 30px;
        }


        .save-button,
        .cancel-button {

            padding: 12px 20px;

            cursor: pointer;

            font-weight: bold;
        }


        .save-button {

            border:
                1px solid
                #49DD4B;

            background: #49DD4B;

            color: #2A2A2A;
        }


        .cancel-button {

            border:
                1px solid
                rgba(255,255,255,0.3);

            background: transparent;

            color: #FFFFFF;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {

                padding: 25px 15px;

            }


            .login-container {

                margin: 50px auto;

                padding: 25px;

            }


            .editor {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LOGIN
    ========================= -->

    <div
        class="login-container"
        id="login-container"
    >

        <h1>
            Zatoshi Rober
        </h1>


        <p class="login-subtitle">
            Admin Panel
        </p>


        <div class="login-field">

            <label for="login-email">
                Email
            </label>

            <input
                type="email"
                id="login-email"
                autocomplete="email"
            >

        </div>


        <div class="login-field">

            <label for="login-password">
                Password
            </label>

            <input
                type="password"
                id="login-password"
                autocomplete="current-password"
            >

        </div>


        <button
            class="login-button"
            id="login-button"
        >
            LOGIN
        </button>


        <p
            class="login-error"
            id="login-error"
        >
        </p>

    </div>



    <!-- =========================
         ADMIN PANEL
    ========================= -->

    <div
        id="admin-panel"
    >

        <h1>
            Zatoshi Rober
        </h1>


        <p class="subtitle">
            Admin Panel — Projects
        </p>


        <button
            class="logout-button"
            id="logout-button"
        >
            LOGOUT
        </button>



        <!-- =========================
             PROJECTS
        ========================= -->

        <div
            class="projects"
            id="projects-container"
        >
        </div>



        <!-- =========================
             EDITOR
        ========================= -->

        <div
            class="editor"
            id="editor"
        >

            <h2>
                Edit Project
            </h2>


            <div class="field">

                <label for="title">
                    Project Title
                </label>

                <input
                    type="text"
                    id="title"
                >

            </div>


            <div class="field">

                <label for="image">
                    Image
                </label>

                <input
                    type="text"
                    id="image"
                >

            </div>


            <div class="field">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                ></textarea>

            </div>


            <div class="field">

                <label for="tags">
                    Tags
                </label>

                <input
                    type="text"
                    id="tags"
                    placeholder="Unity, C#, 2D"
                >

            </div>


            <div class="field">

                <label for="link">
                    Project Link
                </label>

                <input
                    type="text"
                    id="link"
                >

            </div>


            <div class="field">

                <label for="buttonText">
                    Button Text
                </label>

                <input
                    type="text"
                    id="buttonText"
                >

            </div>


            <div class="editor-actions">

                <button
                    class="save-button"
                    id="save-button"
                >
                    SAVE
                </button>


                <button
                    class="cancel-button"
                    id="cancel-button"
                >
                    CANCEL
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         ADMIN SYSTEM
    ========================= -->

    <script>

        /* =========================
           SUPABASE CONFIGURATION
        ========================= */

        const SUPABASE_URL =
            "https://dtyxomanxjghnqoshojk.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_JGKuOtOYZxH7dG7NDtiOAg_mT2MgGbE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );



        /* =========================
           LOGIN ELEMENTS
        ========================= */

        const loginContainer =
            document.getElementById(
                "login-container"
            );


        const loginEmail =
            document.getElementById(
                "login-email"
            );


        const loginPassword =
            document.getElementById(
                "login-password"
            );


        const loginButton =
            document.getElementById(
                "login-button"
            );


        const loginError =
            document.getElementById(
                "login-error"
            );


        const adminPanel =
            document.getElementById(
                "admin-panel"
            );


        const logoutButton =
            document.getElementById(
                "logout-button"
            );



        /* =========================
           PROJECT ELEMENTS
        ========================= */

        const projectsContainer =
            document.getElementById(
                "projects-container"
            );


        const editor =
            document.getElementById(
                "editor"
            );


        const titleInput =
            document.getElementById(
                "title"
            );


        const imageInput =
            document.getElementById(
                "image"
            );


        const descriptionInput =
            document.getElementById(
                "description"
            );


        const tagsInput =
            document.getElementById(
                "tags"
            );


        const linkInput =
            document.getElementById(
                "link"
            );


        const buttonTextInput =
            document.getElementById(
                "buttonText"
            );


        const saveButton =
            document.getElementById(
                "save-button"
            );


        const cancelButton =
            document.getElementById(
                "cancel-button"
            );


        let projects = [];

        let selectedProject = null;



        /* =========================
           LOGIN
        ========================= */

        async function login() {

            loginError.style.display =
                "none";


            const email =
                loginEmail.value.trim();


            const password =
                loginPassword.value;


            if (!email || !password) {

                loginError.textContent =
                    "Enter your email and password.";

                loginError.style.display =
                    "block";

                return;

            }


            loginButton.disabled = true;

            loginButton.textContent =
                "LOGGING IN...";


            const { error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(
                    "Login error:",
                    error
                );


                loginError.textContent =
                    "Invalid email or password.";

                loginError.style.display =
                    "block";

                loginButton.disabled = false;

                loginButton.textContent =
                    "LOGIN";

                return;

            }


            await showAdminPanel();

        }



        /* =========================
           SHOW ADMIN PANEL
        ========================= */

        async function showAdminPanel() {

            loginContainer.style.display =
                "none";


            adminPanel.style.display =
                "block";


            loginButton.disabled = false;

            loginButton.textContent =
                "LOGIN";


            await loadProjects();

        }



        /* =========================
           LOGOUT
        ========================= */

        async function logout() {

            await supabaseClient.auth.signOut();


            adminPanel.style.display =
                "none";


            loginContainer.style.display =
                "block";


            loginPassword.value = "";

        }



        /* =========================
           LOGIN BUTTON
        ========================= */

        loginButton.addEventListener(
            "click",
            login
        );



        /* =========================
           ENTER KEY LOGIN
        ========================= */

        loginPassword.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    login();

                }

            }
        );



        /* =========================
           LOGOUT BUTTON
        ========================= */

        logoutButton.addEventListener(
            "click",
            logout
        );



        /* =========================
           LOAD PROJECTS FROM SUPABASE
        ========================= */

        async function loadProjects() {

            projectsContainer.innerHTML = `
                <p style="opacity:0.6;">
                    Loading projects...
                </p>
            `;


            const { data, error } =
                await supabaseClient

                    .from("projects")

                    .select("*")

                    .order("id", {
                        ascending: true
                    });


            if (error) {

                console.error(
                    "Error loading projects:",
                    error
                );


                projectsContainer.innerHTML = `
                    <p style="color:#ff6b6b;">
                        Error loading projects.
                    </p>
                `;

                return;

            }


            projects =
                data.map(project => ({

                    id:
                        project.id,

                    number:
                        project.number,

                    title:
                        project.title,

                    image:
                        project.image,

                    description:
                        project.description,

                    tags:
                        project.tags
                            ? project.tags
                                .split(",")
                                .map(
                                    tag =>
                                        tag.trim()
                                )
                                .filter(
                                    tag =>
                                        tag !== ""
                                )
                            : [],

                    link:
                        project.link,

                    buttonText:
                        project.button_text,

                    featured:
                        project.featured

                }));


            renderProjects();

        }



        /* =========================
           CREATE PROJECT CARDS
        ========================= */

        function renderProjects() {

            projectsContainer.innerHTML = "";


            projects.forEach(project => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "project-card";


                card.innerHTML = `

                    <div
                        class="project-number"
                    >
                        PROJECT ${project.number}
                    </div>


                    <h2>
                        ${project.title}
                    </h2>


                    <p>
                        ${project.description}
                    </p>


                    <div class="tags">

                        ${project.tags.map(tag => `

                            <span class="tag">
                                ${tag}
                            </span>

                        `).join("")}

                    </div>


                    <button
                        class="edit-button"
                        data-id="${project.id}"
                    >
                        EDIT
                    </button>

                `;


                projectsContainer.appendChild(
                    card
                );

            });


            addEditEvents();

        }



        /* =========================
           EDIT BUTTONS
        ========================= */

        function addEditEvents() {

            const buttons =
                document.querySelectorAll(
                    ".edit-button"
                );


            buttons.forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            Number(
                                button.dataset.id
                            );


                        openEditor(id);

                    }
                );

            });

        }



        /* =========================
           OPEN EDITOR
        ========================= */

        function openEditor(id) {

            selectedProject =
                projects.find(
                    project =>
                        project.id === id
                );


            if (!selectedProject) {

                return;

            }


            titleInput.value =
                selectedProject.title;


            imageInput.value =
                selectedProject.image;


            descriptionInput.value =
                selectedProject.description;


            tagsInput.value =
                selectedProject.tags.join(
                    ", "
                );


            linkInput.value =
                selectedProject.link;


            buttonTextInput.value =
                selectedProject.buttonText;


            editor.classList.add(
                "active"
            );


            editor.scrollIntoView({
                behavior: "smooth"
            });

        }



        /* =========================
           TEMPORARY SAVE
        ========================= */

        saveButton.addEventListener(
            "click",
            () => {

                if (!selectedProject) {

                    return;

                }


                selectedProject.title =
                    titleInput.value;


                selectedProject.image =
                    imageInput.value;


                selectedProject.description =
                    descriptionInput.value;


                selectedProject.tags =
                    tagsInput.value
                        .split(",")
                        .map(tag => tag.trim())
                        .filter(
                            tag =>
                                tag !== ""
                        );


                selectedProject.link =
                    linkInput.value;


                selectedProject.buttonText =
                    buttonTextInput.value;


                renderProjects();


                editor.classList.remove(
                    "active"
                );


                alert(
                    "Changes updated temporarily."
                );

            }
        );



        /* =========================
           CANCEL
        ========================= */

        cancelButton.addEventListener(
            "click",
            () => {

                selectedProject = null;


                editor.classList.remove(
                    "active"
                );

            }
        );



        /* =========================
           CHECK EXISTING SESSION
        ========================= */

        async function checkSession() {

            const { data } =
                await supabaseClient.auth.getSession();


            if (data.session) {

                await showAdminPanel();

            }

        }


        checkSession();

    </script>


</body>

</html>
