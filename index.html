<meta charset="UTF-8">

<title>Zatoshi Rober | Indie Game Developer</title>

<meta name="description" content="Zatoshi Rober - Indie Game Developer creating games, worlds and interactive experiences with Unity.">

<style>

    /* =========================
       RESET
    ========================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #2A2A2A;
        color: #FFFFFF;
        line-height: 1.6;
    }


    /* =========================
       NAVBAR
    ========================= */

    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;

        padding: 20px 8%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        background: rgba(42, 42, 42, 0.90);

        backdrop-filter: blur(10px);

        z-index: 1000;

        border-bottom:
            1px solid rgba(255,255,255,0.08);
    }


    .logo img {
        height: 45px;
        width: auto;
        display: block;
    }


    nav {
        display: flex;
        gap: 30px;
    }


    nav a {
        color: #49DD4B;

        text-decoration: none;

        font-size: 0.95rem;

        transition: 0.3s;

        position: relative;
    }


    nav a::after {
        content: "";

        position: absolute;

        left: 0;

        bottom: -6px;

        width: 0;

        height: 2px;

        background: #49DD4B;

        transition: width 0.3s ease;
    }


    nav a:hover::after {
        width: 100%;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
        padding-top: 110px;
        padding-bottom: 70px;

        text-align: center;
    }


    /* =========================
       VIDEO BANNER
    ========================= */

    .hero-video-container {
        width: 100%;

        height: 420px;

        position: relative;

        overflow: hidden;

        background: #111;

        border-top:
            1px solid rgba(255,255,255,0.08);

        border-bottom:
            1px solid rgba(255,255,255,0.08);
    }


    .hero-video {
        width: 100%;

        height: 100%;

        object-fit: cover;

        display: block;
    }


    /* OSCURECER UN POCO EL VIDEO */

    .hero-video-overlay {
        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background:
            linear-gradient(
                to bottom,
                rgba(0,0,0,0.15),
                rgba(0,0,0,0.45)
            );

        pointer-events: none;
    }


    /* =========================
       HERO CONTENT
    ========================= */

    .hero-content {
        max-width: 900px;

        margin: 45px auto 0;

        padding: 0 20px;
    }


    .hero p.small-title {
        font-size: 0.9rem;

        letter-spacing: 4px;

        text-transform: uppercase;

        color: #49DD4B;

        opacity: 0.9;

        margin-bottom: 20px;
    }


    .hero h1 {
        font-size:
            clamp(3rem, 8vw, 7rem);

        line-height: 1;

        margin-bottom: 25px;
    }


    .hero h2 {
        font-size:
            clamp(1.2rem, 3vw, 2rem);

        font-weight: normal;

        opacity: 0.75;

        margin-bottom: 30px;
    }


    .hero-description {
        max-width: 650px;

        margin: 0 auto 40px;

        opacity: 0.65;
    }


    /* =========================
       BUTTON
    ========================= */

    .button {
        display: inline-block;

        padding: 14px 28px;

        border:
            1px solid #49DD4B;

        color: #49DD4B;

        text-decoration: none;

        transition: 0.3s;

        font-weight: bold;

        letter-spacing: 1px;
    }


    .button:hover {
        background: #49DD4B;

        color: #2A2A2A;

        transform: translateY(-2px);
    }


    /* =========================
       SECTIONS
    ========================= */

    section {
        padding: 100px 8%;
    }


    .section-title {
        font-size: 2.5rem;

        margin-bottom: 50px;

        position: relative;
    }


    .section-title::after {
        content: "";

        display: block;

        width: 50px;

        height: 3px;

        background: #49DD4B;

        margin-top: 12px;
    }


    /* =========================
       PROJECTS
    ========================= */

    .projects {
        display: grid;

        grid-template-columns:
            repeat(auto-fit, minmax(280px, 1fr));

        gap: 30px;
    }


    .project-card {
        border:
            1px solid rgba(255,255,255,0.1);

        padding: 30px;

        background: #2A2A2A;

        transition: 0.3s;
    }
